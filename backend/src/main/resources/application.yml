server:
  port: 8080

spring:
  application:
    name: leopaints
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/leopaints}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:leopaints-secret-key-change-in-production-make-it-long-256-bits}
    access-token-expiry: 900000
    refresh-token-expiry: 604800000
  otp:
    expiry-minutes: 5
    max-attempts: 5
  cashfree:
    app-id: ${CASHFREE_APP_ID:}
    secret-key: ${CASHFREE_SECRET_KEY:}
    api-version: "2023-08-01"
    base-url: ${CASHFREE_BASE_URL:https://sandbox.cashfree.com/pg}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
